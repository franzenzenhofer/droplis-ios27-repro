name: ios27-launch-repro
on: { push: { branches: [main] }, workflow_dispatch: {} }
jobs:
  build-26:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app && xcodebuild -version
      - run: xcodebuild -project Droplis.xcodeproj -target Droplis -configuration Release -sdk iphonesimulator -arch arm64 CODE_SIGNING_ALLOWED=NO SYMROOT=$PWD/out build | tail -5
      - run: cd out/Release-iphonesimulator && zip -qry ../../app26.zip Droplis.app
      - uses: actions/upload-artifact@v4
        with: { name: app26, path: app26.zip }
  ios27:
    needs: build-26
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        device: ["iPhone 17 Pro$", "iPhone 17 Pro Max", "iPad Air 11-inch \\(M3\\)", "iPad Pro 13-inch \\(M5\\)$", "iPad \\(A16\\)"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: app26 }
      - run: unzip -q app26.zip && xcrun simctl list runtimes | grep iOS && xcrun simctl list devicetypes | grep -E "iPhone 17|iPad"
      - run: ./sim-matrix.sh "$PWD/Droplis.app" "iOS 27" out "${{ matrix.device }}"
      - if: always()
        run: echo "ART=$(echo '${{ matrix.device }}' | tr -cd 'A-Za-z0-9')" >> $GITHUB_ENV
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: "ios27-${{ env.ART }}", path: out }

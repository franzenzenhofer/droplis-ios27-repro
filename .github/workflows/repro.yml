name: ios27-launch-repro
on: { push: { branches: [main] }, workflow_dispatch: {} }
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - run: xcodebuild -project Droplis.xcodeproj -target Droplis -configuration Release -sdk iphonesimulator -arch arm64 CODE_SIGNING_ALLOWED=NO SYMROOT=$PWD/outA build | tail -2
      - run: sed -i '' 's/^        context.coordinator.audio.start(webView)$/        \/\/ variant B/' Sources/GameWebView.swift && grep -c "variant B" Sources/GameWebView.swift
      - run: xcodebuild -project Droplis.xcodeproj -target Droplis -configuration Release -sdk iphonesimulator -arch arm64 CODE_SIGNING_ALLOWED=NO SYMROOT=$PWD/outB build | tail -2
      - run: (cd outA/Release-iphonesimulator && zip -qry ../../A.zip Droplis.app) && (cd outB/Release-iphonesimulator && zip -qry ../../B.zip Droplis.app)
      - uses: actions/upload-artifact@v4
        with: { name: apps, path: "*.zip" }
  loop27:
    needs: build
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [A, B]
        device: ["iPhone 17 Pro", "iPad Air 11-inch (M3)"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apps }
      - run: unzip -q ${{ matrix.variant }}.zip
      - run: ./launch-loop.sh "$PWD/Droplis.app" "iOS 27" "${{ matrix.device }}" 40 out
      - if: always()
        run: echo "ART=${{ matrix.variant }}-$(echo '${{ matrix.device }}' | tr -cd 'A-Za-z0-9')" >> $GITHUB_ENV
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: "loop-${{ env.ART }}", path: out }
